name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun environment
        uses: logica-oss/actions-toolkit/setup-bun@370527b37cd9cd32e93cbdf9ab80459581ed59fe # v1.2.6
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format
      - name: Sync Agent Config
        uses: logica-oss/synac@3f44c1c225ed3380e9989f8e07f98a2122138496 # v0.2.2
        with:
          verify: "false"
      - name: Autofix Text
        uses: logica-oss/actions-toolkit/autofix-text@370527b37cd9cd32e93cbdf9ab80459581ed59fe # v1.2.6
