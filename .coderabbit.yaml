language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  path_filters:
    - "!.github/skills/**"
    - "!.github/instructions/**"
    - "!.github/copilot-instructions.md"

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"
      - "mergify[bot]"

  path_instructions:
    - path: "package.json"
      instructions: "The coverage script intentionally keeps the `bun -b` flag: V8 coverage output was verified identical under Bun and Node runtimes, and `-b` keeps runtime consistency with the other scripts. Do not suggest removing it."
    - path: ".github/workflows/autofix.yaml"
      instructions: "Accept by design (do not report): the synac step intentionally omits the version input to always use the latest release; do not suggest pinning a version."
    - path: "vitest.config.ts"
      instructions: "The V8 coverage provider is intentional: `bun run coverage` was verified to generate coverage/lcov.info with identical numbers under both Bun and Node runtimes. Do not suggest switching to the Istanbul provider."
